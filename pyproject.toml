[project]
name = "swissdevjobs-cli"
version = "0.8.0"
description = "Search and apply to tech jobs across 7 countries (CH/DE/UK/US/CA/NL/FR) with salary data — CLI + MCP server, zero dependencies"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Bryan Tran" }]
license = { file = "LICENSE" }
keywords = ["jobs", "job-search", "cli", "mcp", "switzerland", "germany", "uk", "salary"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Stupidoodle/swissdevjobs-cli"
Issues = "https://github.com/Stupidoodle/swissdevjobs-cli/issues"

[project.scripts]
swissdevjobs = "swissdevjobs_cli.entrypoints.cli:main"
sdj = "swissdevjobs_cli.entrypoints.cli:main"
swissdevjobs-mcp = "swissdevjobs_cli.entrypoints.mcp:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.13; python_version >= '3.10'",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    "ty>=0.0.73",
]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
# COM812 dropped deliberately: it conflicts with `ruff format`.
select = ["E", "F", "C", "D", "B", "I", "Q", "UP", "ASYNC", "TID", "S"]

[tool.ruff.lint.per-file-ignores]
# S608: test fixtures build tables from literal dicts, not user input.
"tests/**" = ["S101", "S108", "S608", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.isort]
known-first-party = ["swissdevjobs_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
markers = [
    "integration: touches a real SQLite file outside the sandbox fixtures",
    "live: hits the REAL job boards read-only; skipped unless SDJ_LIVE=1",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["src/swissdevjobs_cli"]
omit = [
    # Two lines of `python -m` glue; exercised only as a subprocess,
    # where coverage cannot see it.
    "src/swissdevjobs_cli/__main__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.$",
    "class .*\\(Protocol\\):",
]

[tool.importlinter]
root_package = "swissdevjobs_cli"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward only"
type = "layers"
layers = [
    "swissdevjobs_cli.entrypoints",
    "swissdevjobs_cli.dto",
    "swissdevjobs_cli.service_layer",
    "swissdevjobs_cli.adapters",
    "swissdevjobs_cli.domain",
]
# bootstrap.py is the composition root: wiring every layer together is its
# job, so it is deliberately outside the contract rather than an exception
# inside it.
exhaustive = false

[[tool.importlinter.contracts]]
name = "The domain is stdlib-only"
type = "forbidden"
source_modules = ["swissdevjobs_cli.domain"]
forbidden_modules = ["pydantic", "requests", "httpx", "urllib3"]
