[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "swissdevjobs-cli"
version = "0.3.0"
description = "CLI for swissdevjobs.ch — list, search, and inspect Swiss dev jobs with salary info"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Bryan Tran" }]
license = { file = "LICENSE" }
keywords = ["jobs", "switzerland", "cli", "job-search"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Stupidoodle/swissdevjobs-cli"
Issues = "https://github.com/Stupidoodle/swissdevjobs-cli/issues"

[project.scripts]
swissdevjobs = "swissdevjobs_cli.cli:main"
sdj = "swissdevjobs_cli.cli:main"
swissdevjobs-mcp = "swissdevjobs_cli.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # long lines are handled by the formatter, not the linter
    "UP006",   # PEP 585 generics need 3.9+ at runtime; we rely on __future__ annotations
    "UP007",   # same, for X | Y
    "UP045",   # same, for X | None
    "RUF001",  # en dashes in salary ranges and prose are deliberate
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
